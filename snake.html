<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Змейка</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center;
         background:#1e1e2e; color:#e0e0e0; font-family:system-ui, sans-serif; }
  canvas { background:#11111b; border:2px solid #45475a; border-radius:8px; }
  #hud { margin-top:10px; font-size:18px; }
  #hint { margin-top:6px; font-size:13px; color:#888; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div id="hud">Счёт: <span id="score">0</span></div>
<div id="hint">Стрелки или WASD · Пробел — пауза · R — заново</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const CELL = 20;                        // размер клетки в пикселях
const COLS = canvas.width / CELL;       // 20 клеток по горизонтали
const ROWS = canvas.height / CELL;      // 20 по вертикали

let snake, dir, nextDir, food, score, alive, paused, timer;

function reset() {
  snake = [{x:5,y:10}, {x:4,y:10}, {x:3,y:10}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  alive = true;
  paused = false;
  scoreEl.textContent = 0;
  placeFood();
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 120);       // 120 мс между шагами — можно менять
  draw();
}

function placeFood() {
  while (true) {
    const p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
    if (!snake.some(s => s.x === p.x && s.y === p.y)) { food = p; return; }
  }
}

function tick() {
  if (!alive || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // врезались в стену
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    alive = false; draw(); return;
  }

  const willEat = head.x === food.x && head.y === food.y;
  const body = willEat ? snake : snake.slice(0, -1);
  // врезались в себя
  if (body.some(s => s.x === head.x && s.y === head.y)) {
    alive = false; draw(); return;
  }

  snake.unshift(head);
  if (willEat) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#11111b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // еда
  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);

  // змейка (голова светлее)
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#74c7ec';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });

  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#cdd6f4';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('Игра окончена', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '16px system-ui';
    ctx.fillText('Счёт: ' + score + ' · R — заново', canvas.width/2, canvas.height/2 + 22);
  } else if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#cdd6f4';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px system-ui';
    ctx.fillText('Пауза', canvas.width/2, canvas.height/2);
  }
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;   // нельзя развернуться на 180°
  nextDir = {x, y};
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') setDir(0, -1);
  if (k === 'arrowdown'  || k === 's') setDir(0, 1);
  if (k === 'arrowleft'  || k === 'a') setDir(-1, 0);
  if (k === 'arrowright' || k === 'd') setDir(1, 0);
  if (k === ' ') { if (alive) { paused = !paused; draw(); } e.preventDefault(); }
  if (k === 'r') reset();
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});

reset();
</script>
</body>
</html>
